<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I-Kraft-Pack — производство крафтовых пакетов</title>
    <meta name="theme-color" content="#08090a" />
    <link rel="icon" type="image/svg+xml" href="/assets/kraft.svg" />
    <script>
      /* Тема выставляется до первой отрисовки — иначе при светлой теме
         мелькнёт тёмный экран, пока не смонтируется React. */
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("kraftvision.theme") || "system";
        } catch (e) {}
        var light =
          mode === "light" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        document.documentElement.style.background = light ? "#f6f2ea" : "#0b0c0d";
      })();
    </script>
    <script>
      // GitHub Pages SPA: restore path from redirect
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search && search.indexOf("?p=/") === 0) {
          var decoded = search.slice(3).replace(/~and~/g, "&");
          var query = location.search
            .slice(1)
            .split("&")
            .filter(function (s) {
              return s.indexOf("p=") !== 0 && s.indexOf("q=") !== 0;
            })
            .join("&");
          var qs = decoded.split("&q=");
          history.replaceState(
            null,
            null,
            location.pathname.split("/").slice(0, 2).join("/") +
              qs[0] +
              (qs[1] ? "?" + qs[1].replace(/~and~/g, "&") : "") +
              (query ? (qs[1] ? "&" : "?") + query : "") +
              location.hash,
          );
        }
      })();
    </script>
    <meta
      name="description"
      content="Производство крафтовых пакетов с фирменной печатью: с ручками и без, фастфуд-серия, пергамент. Собственное производство, тиражи от 2000 шт."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
